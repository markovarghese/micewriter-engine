[package]
name = "micewriter-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "micewriter-engine"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Local cache
rocksdb = "0.24"

# Apache Iceberg — REST catalog (Nessie) + FileIO (S3/MinIO)
iceberg = "0.9"
iceberg-catalog-rest = "0.9"
iceberg-catalog-glue = "0.9"
iceberg-storage-opendal = "0.9"

# Columnar in-memory format and Parquet serialization
arrow = "57"
serde_arrow = { version = "0.14", features = ["arrow-57"] }
parquet = { version = "57", features = ["arrow", "zstd"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# gRPC transport
tonic = "0.11"
prost = "0.12"

# Randomness for flush jitter
rand = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unique IDs for Parquet file paths
uuid = { version = "1", features = ["v4"] }

# Byte buffers
bytes = "1"

# Profiling
pprof = { version = "0.13", features = ["flamegraph"] }
axum = "0.7"

# Prometheus metrics
prometheus = "0.13"
lazy_static = "1.4"

[profile.release]
debug = 1

[features]
# Native Rust Iceberg support is sufficient; no Python fallback needed.

[build-dependencies]
tonic-build = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
