<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1320 545" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="mIceWriter Engine architecture: telemetry records flow from the Java SDK over a Unix domain socket into uds_server.rs, are buffered in RocksDB, then flushed as Parquet to an Apache Iceberg table.">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowAccent" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#818cf8"/>
    </marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1320" height="545" fill="#0f172a"/>
  <rect x="0" y="0" width="1320" height="545" fill="url(#bgGrad)"/>

  <!-- title -->
  <text x="40" y="40" fill="#e2e8f0" font-size="22" font-weight="700">mIceWriter Engine</text>
  <text x="41" y="62" fill="#94a3b8" font-size="13">From Unix socket to Apache Iceberg</text>

  <!-- legend -->
  <g font-size="11" fill="#94a3b8">
    <circle cx="980" cy="36" r="4.5" fill="#7dd3fc"/>
    <text x="992" y="40">raw record (JSON)</text>
    <circle cx="1130" cy="36" r="4.5" fill="#5eead4"/>
    <text x="1142" y="40">columnar (Parquet)</text>
  </g>

  <!-- ============ INGESTION (top band) ============ -->

  <!-- edges (drawn first, under nodes) -->
  <path d="M190,170 L300,173" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400,118 L400,88" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500,173 L600,173" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ACK return -->
  <path d="M300,205 L192,205" fill="none" stroke="#3f4d63" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <text x="245" y="162" fill="#94a3b8" font-size="11" text-anchor="middle">UDS</text>
  <text x="412" y="106" fill="#94a3b8" font-size="11">0x01</text>
  <text x="550" y="165" fill="#94a3b8" font-size="11" text-anchor="middle">0x02</text>
  <text x="246" y="220" fill="#64748b" font-size="10" text-anchor="middle">ACK (after durable write)</text>

  <!-- Java SDK -->
  <rect x="40" y="120" width="150" height="92" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="115" y="156" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Java SDK</text>
  <text x="115" y="178" fill="#94a3b8" font-size="11" text-anchor="middle">telemetry source</text>
  <text x="115" y="194" fill="#64748b" font-size="10" text-anchor="middle">register &#183; ingest &#183; flush</text>

  <!-- SchemaRegistry -->
  <rect x="300" y="30" width="200" height="58" rx="10" fill="#16233a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="400" y="54" fill="#cbd5e1" font-size="14" font-weight="600" text-anchor="middle">SchemaRegistry</text>
  <text x="400" y="73" fill="#64748b" font-size="10" text-anchor="middle">in&#8209;memory &#183; lost on restart</text>

  <!-- uds_server.rs -->
  <rect x="300" y="118" width="200" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="146" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">uds_server.rs</text>
  <text x="400" y="167" fill="#94a3b8" font-size="11" text-anchor="middle">Tokio UDS listener</text>
  <text x="400" y="184" fill="#64748b" font-size="10" text-anchor="middle">Parse JSON &#8594; Arrow IPC</text>
  <text x="400" y="206" fill="#64748b" font-size="10" text-anchor="middle">Schema cache &#183; Pool</text>

  <!-- rocksdb_store.rs -->
  <rect x="600" y="110" width="220" height="128" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="710" y="136" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">rocksdb_store.rs</text>
  <text x="710" y="155" fill="#94a3b8" font-size="10" text-anchor="middle">durable IPC bytes &#183; Direct I/O</text>
  <rect x="622" y="166" width="176" height="26" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1.3">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="710" y="184" fill="#c7d2fe" font-size="12" font-weight="600" text-anchor="middle">Active CF</text>
  <rect x="636" y="202" width="160" height="12" rx="3" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
  <rect x="628" y="208" width="160" height="12" rx="3" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
  <text x="710" y="230" fill="#818cf8" font-size="10" text-anchor="middle">frozen CFs (awaiting flush)</text>

  <!-- ============ ROTATE transition ============ -->
  <path d="M710,238 L710,296 L105,296 L105,362" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowAccent)">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.7s" repeatCount="indefinite"/>
  </path>
  <text x="408" y="289" fill="#a5b4fc" font-size="11.5" font-weight="600" text-anchor="middle">rotate() &#8226; jittered ~5&#8202;min timer / MSG_FLUSH_NOW / SIGTERM &#8594; frozen CF drained</text>

  <!-- ============ FLUSH PIPELINE (bottom band) ============ -->
  <rect x="20" y="330" width="770" height="174" rx="14" fill="#15202f" stroke="#334155" stroke-width="1.5"/>
  <text x="34" y="350" fill="#93c5fd" font-size="13" font-weight="600">flush_engine.rs &#8226; compile_cf_pipeline (concurrent, scales to CPU &amp; pod memory)</text>

  <!-- bottom edges -->
  <path d="M170,412 L210,412" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M390,412 L430,412" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M580,412 L620,412" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <path d="M770,412 L810,412" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <path d="M950,412 L990,412" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <path d="M1140,412 L1180,412" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <text x="695" y="402" fill="#5eead4" font-size="10" text-anchor="middle">upload</text>
  <text x="1160" y="402" fill="#5eead4" font-size="10" text-anchor="middle">commit</text>

  <!-- Reader -->
  <rect x="40" y="372" width="130" height="92" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="105" y="404" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Reader</text>
  <text x="105" y="425" fill="#94a3b8" font-size="10" text-anchor="middle">stream IPC</text>
  <text x="105" y="440" fill="#64748b" font-size="9.5" text-anchor="middle">queue depth = 2</text>

  <!-- Stream pipeline -->
  <rect x="210" y="362" width="180" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="388" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Stream pipeline</text>
  <g stroke="#38bdf8" stroke-width="3" opacity="0.55">
    <line x1="232" y1="404" x2="368" y2="404"/>
    <line x1="232" y1="416" x2="368" y2="416"/>
    <line x1="232" y1="428" x2="368" y2="428"/>
  </g>
  <text x="300" y="452" fill="#94a3b8" font-size="10" text-anchor="middle">direct Arrow IPC streaming</text>

  <!-- Parquet writer -->
  <rect x="430" y="372" width="150" height="92" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="505" y="404" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Parquet writer</text>
  <text x="505" y="425" fill="#94a3b8" font-size="10" text-anchor="middle">AsyncArrowWriter</text>
  <text x="505" y="440" fill="#64748b" font-size="9.5" text-anchor="middle">16MiB row groups</text>

  <!-- S3 uploader -->
  <rect x="620" y="372" width="150" height="92" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="695" y="404" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">S3 uploader</text>
  <text x="695" y="425" fill="#94a3b8" font-size="10" text-anchor="middle">async task</text>
  <text x="695" y="440" fill="#64748b" font-size="9.5" text-anchor="middle">bounded concurrency</text>

  <!-- MinIO S3 -->
  <rect x="810" y="372" width="140" height="92" rx="10" fill="#11241f" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="880" y="404" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">MinIO S3</text>
  <text x="880" y="425" fill="#94a3b8" font-size="10" text-anchor="middle">Parquet data files</text>
  <text x="880" y="440" fill="#64748b" font-size="9.5" text-anchor="middle">via FileIO</text>

  <!-- iceberg_writer.rs -->
  <rect x="990" y="372" width="150" height="92" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="1065" y="400" fill="#e2e8f0" font-size="13.5" font-weight="600" text-anchor="middle">iceberg_writer.rs</text>
  <text x="1065" y="421" fill="#94a3b8" font-size="10" text-anchor="middle">fast_append</text>
  <text x="1065" y="436" fill="#64748b" font-size="9.5" text-anchor="middle">Nessie / Glue &#183; retry&#215;5</text>

  <!-- Iceberg Table (destination) -->
  <rect x="1180" y="360" width="120" height="112" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="2.5" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="1240" y="404" fill="#ccfbf1" font-size="14" font-weight="700" text-anchor="middle">Apache</text>
  <text x="1240" y="423" fill="#ccfbf1" font-size="14" font-weight="700" text-anchor="middle">Iceberg</text>
  <text x="1240" y="442" fill="#99f6e4" font-size="12" text-anchor="middle">Table</text>

  <!-- ============ ANIMATED RECORD PACKETS ============ -->
  <!-- Java -> uds -->
  <circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.5s" repeatCount="indefinite" path="M190,170 L300,173"/></circle>
  <circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.5s" begin="0.75s" repeatCount="indefinite" path="M190,170 L300,173"/></circle>
  <!-- uds -> schema (occasional) -->
  <circle r="4" fill="#cbd5e1"><animateMotion dur="3s" repeatCount="indefinite" path="M400,118 L400,88"/></circle>
  <!-- uds -> rocksdb -->
  <circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.4s" repeatCount="indefinite" path="M500,173 L600,173"/></circle>
  <circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite" path="M500,173 L600,173"/></circle>
  <!-- rotate transition -->
  <circle r="5" fill="#a5b4fc"><animateMotion dur="2.6s" repeatCount="indefinite" path="M710,238 L710,296 L105,296 L105,362"/></circle>
  <circle r="5" fill="#a5b4fc"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M710,238 L710,296 L105,296 L105,362"/></circle>
  <!-- reader -> parser -->
  <circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.1s" repeatCount="indefinite" path="M170,412 L210,412"/></circle>
  <!-- parser -> parquet -->
  <circle r="4.5" fill="#7dd3fc"><animateMotion dur="1.1s" repeatCount="indefinite" path="M390,412 L430,412"/></circle>
  <!-- parquet -> uploader (now columnar) -->
  <circle r="4.5" fill="#5eead4"><animateMotion dur="1.1s" repeatCount="indefinite" path="M580,412 L620,412"/></circle>
  <!-- uploader -> minio -->
  <circle r="4.5" fill="#5eead4"><animateMotion dur="1.1s" repeatCount="indefinite" path="M770,412 L810,412"/></circle>
  <!-- minio -> iceberg_writer -->
  <circle r="4.5" fill="#5eead4"><animateMotion dur="1.1s" repeatCount="indefinite" path="M950,412 L990,412"/></circle>
  <!-- iceberg_writer -> table -->
  <circle r="5" fill="#5eead4"><animateMotion dur="1.2s" repeatCount="indefinite" path="M1140,412 L1180,412"/></circle>

  <!-- bg gradient def (referenced above) -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
  </defs>
</svg>
